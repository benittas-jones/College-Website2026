<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041226"/>
      <stop offset="50%" stop-color="#001E44"/>
      <stop offset="100%" stop-color="#002D62"/>
    </linearGradient>

    <!-- Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="30%" stop-color="#FFD857"/>
      <stop offset="70%" stop-color="#C99700"/>
      <stop offset="100%" stop-color="#8C6600"/>
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFEAA7"/>
      <stop offset="50%" stop-color="#FFD857"/>
      <stop offset="100%" stop-color="#C99700"/>
    </linearGradient>

    <!-- Shield Inner Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#06172b"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Subtle Geometric Quality Grid Pattern in Background -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <circle cx="400" cy="270" r="240" fill="none"/>
    <circle cx="400" cy="270" r="190" fill="none" stroke-dasharray="4,4"/>
    <circle cx="400" cy="270" r="140" fill="none"/>
    <line x1="160" y1="270" x2="640" y2="270"/>
    <line x1="400" y1="30" x2="400" y2="510"/>
    <line x1="230" y1="100" x2="570" y2="440"/>
    <line x1="230" y1="440" x2="570" y2="100"/>
  </g>

  <!-- Outer Golden Laurel Wreath (Quality Symbol) -->
  <g filter="url(#goldGlow)" opacity="0.85">
    <!-- Left Laurel Branch -->
    <path d="M 270 330 C 240 270 245 190 300 130 C 310 145 310 165 295 180 C 275 200 270 240 285 285 C 295 270 315 265 315 280 C 300 310 285 320 270 330 Z" fill="url(#goldGrad)" opacity="0.7"/>
    <!-- Left Leaves -->
    <path d="M 235 220 Q 255 210 265 225 Q 245 235 235 220 Z" fill="url(#goldGrad)"/>
    <path d="M 245 170 Q 268 165 275 182 Q 252 188 245 170 Z" fill="url(#goldGrad)"/>
    <path d="M 268 125 Q 290 125 295 145 Q 272 148 268 125 Z" fill="url(#goldGrad)"/>
    <path d="M 302 92 Q 325 98 325 118 Q 302 118 302 92 Z" fill="url(#goldGrad)"/>
    <path d="M 235 275 Q 255 268 268 282 Q 248 290 235 275 Z" fill="url(#goldGrad)"/>
    <path d="M 252 330 Q 270 320 282 335 Q 262 345 252 330 Z" fill="url(#goldGrad)"/>
    <path d="M 285 375 Q 302 365 315 378 Q 295 390 285 375 Z" fill="url(#goldGrad)"/>

    <!-- Right Laurel Branch -->
    <path d="M 530 330 C 560 270 555 190 500 130 C 490 145 490 165 505 180 C 525 200 530 240 515 285 C 505 270 485 265 485 280 C 500 310 515 320 530 330 Z" fill="url(#goldGrad)" opacity="0.7"/>
    <!-- Right Leaves -->
    <path d="M 565 220 Q 545 210 535 225 Q 555 235 565 220 Z" fill="url(#goldGrad)"/>
    <path d="M 555 170 Q 532 165 525 182 Q 548 188 555 170 Z" fill="url(#goldGrad)"/>
    <path d="M 532 125 Q 510 125 505 145 Q 528 148 532 125 Z" fill="url(#goldGrad)"/>
    <path d="M 498 92 Q 475 98 475 118 Q 498 118 498 92 Z" fill="url(#goldGrad)"/>
    <path d="M 565 275 Q 545 268 532 282 Q 552 290 565 275 Z" fill="url(#goldGrad)"/>
    <path d="M 548 330 Q 530 320 518 335 Q 538 345 548 330 Z" fill="url(#goldGrad)"/>
    <path d="M 515 375 Q 498 365 485 378 Q 505 390 515 375 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Central Quality Shield Outer Bevel -->
  <g filter="url(#softShadow)">
    <path d="M 400 80 
             C 470 80 520 100 520 160 
             C 520 280 470 380 400 420 
             C 330 380 280 280 280 160 
             C 280 100 330 80 400 80 Z" 
          fill="url(#goldGrad)"/>
    
    <!-- Shield Inset Border -->
    <path d="M 400 90 
             C 463 90 508 108 508 162 
             C 508 273 463 366 400 405 
             C 337 366 292 273 292 162 
             C 292 108 337 90 400 90 Z" 
          fill="#00142e"/>

    <!-- Shield Inner Body -->
    <path d="M 400 96 
             C 458 96 500 113 500 163 
             C 500 268 458 358 400 395 
             C 342 358 300 268 300 163 
             C 300 113 342 96 400 96 Z" 
          fill="url(#shieldGrad)"/>
  </g>

  <!-- Shield Core Graphics -->
  <!-- 1. Five Golden Stars on Top (Pinnacle of Quality) -->
  <g fill="url(#goldGrad)" transform="translate(0, -6)">
    <!-- Center Star -->
    <polygon points="400,120 404,132 417,132 407,140 411,152 400,144 389,152 393,140 383,132 396,132" transform="scale(1.15) translate(-52, -20)"/>
    <!-- Star 2 -->
    <polygon points="365,130 368,139 378,139 370,145 373,154 365,148 357,154 360,145 352,139 362,139"/>
    <!-- Star 3 -->
    <polygon points="435,130 438,139 448,139 440,145 443,154 435,148 427,154 430,145 422,139 432,139"/>
    <!-- Star 1 -->
    <polygon points="335,145 337,152 345,152 339,157 341,164 335,159 329,164 331,157 325,152 333,152"/>
    <!-- Star 5 -->
    <polygon points="465,145 467,152 475,152 469,157 471,164 465,159 459,164 461,157 455,152 463,152"/>
  </g>

  <!-- 2. Academic Cap / Mortarboard of Academic Standards -->
  <g id="academicCap" transform="translate(400, 195) scale(0.9)">
    <!-- Cap Diamond -->
    <polygon points="0,-25 65,0 0,25 -65,0" fill="url(#goldGrad)" stroke="#FFEAA7" stroke-width="1.5"/>
    <!-- Cap Skull Base -->
    <path d="M -35 5 L -35 25 C -35 38 35 38 35 25 L 35 5 Z" fill="#001E44" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Tassel -->
    <circle cx="0" cy="-2" r="4" fill="#FFFFFF"/>
    <path d="M 0 -2 C 25 -2 45 10 48 35" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <rect x="44" y="35" width="8" height="16" rx="2" fill="url(#goldGrad)"/>
  </g>

  <!-- 3. Open Book of Knowledge & Quality Curriculum -->
  <g id="openBook" transform="translate(400, 275) scale(0.95)">
    <!-- Left Page -->
    <path d="M -4 -8 C -25 -18 -55 -16 -75 -10 L -75 35 C -55 29 -25 27 -4 37 Z" fill="#FFFFFF" opacity="0.95"/>
    <path d="M -4 -8 C -25 -18 -55 -16 -75 -10 L -75 35 C -55 29 -25 27 -4 37 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Lines on Left Page -->
    <line x1="-65" y1="2" x2="-16" y2="-4" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="-65" y1="12" x2="-16" y2="6" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="-65" y1="22" x2="-25" y2="16" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>

    <!-- Right Page -->
    <path d="M 4 -8 C 25 -18 55 -16 75 -10 L 75 35 C 55 29 25 27 4 37 Z" fill="#FFFFFF" opacity="0.95"/>
    <path d="M 4 -8 C 25 -18 55 -16 75 -10 L 75 35 C 55 29 25 27 4 37 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Lines on Right Page -->
    <line x1="16" y1="-4" x2="65" y2="2" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="16" y1="6" x2="65" y2="12" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="25" y1="16" x2="65" y2="22" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>

    <!-- Spine -->
    <line x1="0" y1="-10" x2="0" y2="40" stroke="url(#goldGrad)" stroke-width="3"/>
  </g>

  <!-- 4. Quality Certified Stamp / Checkmark Badge -->
  <g transform="translate(400, 360)">
    <circle cx="0" cy="0" r="22" fill="url(#goldGrad)" filter="url(#goldGlow)"/>
    <circle cx="0" cy="0" r="18" fill="#001E44"/>
    <!-- Verified Checkmark -->
    <path d="M -8 0 L -3 5 L 8 -6" fill="none" stroke="#FFD857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Golden Quality Ribbon Across Lower Section -->
  <g filter="url(#softShadow)" transform="translate(0, 20)">
    <!-- Ribbon Tail Left -->
    <polygon points="170,440 240,410 240,460 170,470 190,455" fill="#8C6600"/>
    <!-- Ribbon Tail Right -->
    <polygon points="630,440 560,410 560,460 630,470 610,455" fill="#8C6600"/>

    <!-- Main Ribbon Center -->
    <path d="M 220 420 L 580 420 L 560 465 L 240 465 Z" fill="url(#goldGrad)"/>
    <path d="M 220 420 L 580 420 L 560 465 L 240 465 Z" fill="none" stroke="#FFF3B0" stroke-width="1.5"/>

    <!-- Ribbon Text -->
    <text x="400" y="449" 
          font-family="'Plus Jakarta Sans', Arial, sans-serif" 
          font-size="14.5" 
          font-weight="800" 
          letter-spacing="3" 
          fill="#00142e" 
          text-anchor="middle">
      QUALITY POLICY &amp; ASSURANCE
    </text>
  </g>

  <!-- Quality Assurance Sub-Pillars Bottom Legend -->
  <g transform="translate(400, 528)" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif">
    <text y="0" font-size="16" font-weight="700" fill="#FFD857" letter-spacing="1.5">
      ACADEMIC EXCELLENCE &bull; HOLISTIC EMPOWERMENT
    </text>
    <text y="24" font-size="12" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
      Values &bull; Self-Reliance &bull; Independent Thinking &bull; Social Responsibility
    </text>
  </g>
</svg>
